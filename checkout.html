<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NexusGames</title>
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">BACK TO NEXUS</a>
        
        <div class="checkout-header">
            <h1>CHECKOUT // SECURE PAYMENT</h1>
            <p>./nexus --checkout --encrypt</p>
        </div>
        
        <div class="checkout-grid">
            <!-- RESUMO DO PEDIDO -->
            <div class="card">
                <h2>RESUMO DO PEDIDO</h2>
                <div id="checkoutItems" class="checkout-items">
                    <div class="empty-cart">🛒 Nenhum jogo no carrinho</div>
                </div>
                <div class="total">
                    <span>TOTAL:</span>
                    <span id="checkoutTotal">R$ 0,00</span>
                </div>
            </div>
            
            <!-- PAGAMENTO E ENDEREÇO -->
            <div class="card">
                <h2>ENDEREÇO DE ENTREGA</h2>
                
                <div class="form-group">
                    <label>RUA</label>
                    <input type="text" id="enderecoEntrega" placeholder="Nome da rua">
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>NÚMERO</label>
                        <input type="text" id="numeroEntrega" placeholder="Nº">
                    </div>
                    <div class="form-group">
                        <label>COMPLEMENTO</label>
                        <input type="text" id="complementoEntrega" placeholder="Apto, Bloco">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>CEP</label>
                    <div class="cep-group">
                        <input type="text" id="cepEntrega" placeholder="00000-000" maxlength="9">
                        <button type="button" id="btnBuscarCEP" class="btn-buscar">🔍 BUSCAR</button>
                    </div>
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>CIDADE</label>
                        <input type="text" id="cidadeEntrega" placeholder="Cidade" readonly>
                    </div>
                    <div class="form-group">
                        <label>ESTADO</label>
                        <input type="text" id="estadoEntrega" placeholder="UF" readonly>
                    </div>
                </div>
                
                <h2 style="margin-top: 25px;">DADOS DO CARTÃO</h2>
                
                <form id="paymentForm">
                    <div class="form-group">
                        <label>NOME NO CARTÃO</label>
                        <input type="text" id="cardName" placeholder="Como está no cartão" required>
                    </div>
                    
                    <div class="form-group">
                        <label>NÚMERO DO CARTÃO</label>
                        <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" required>
                    </div>
                    
                    <div class="row">
                        <div class="form-group">
                            <label>VALIDADE</label>
                            <input type="text" id="cardExpiry" placeholder="MM/AA" required>
                        </div>
                        <div class="form-group">
                            <label>CVV</label>
                            <input type="text" id="cardCvv" placeholder="123" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="pay-btn">FINALIZAR PAGAMENTO</button>
                </form>
            </div>
        </div>
        
        <footer>
            <p>nexus_checkout.secure || payment.gateway = active</p>
        </footer>
    </div>
    
    <script src="checkout.js"></script>
</body>
</html>
